<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>indigenous.ai</title>
  <link rel="stylesheet" href="/language/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🪶</text></svg>">
</head>
<body>
  <main id="view">
    <div class="login-wrap">
      <div class="brand-big">indigenous.ai</div>
      <div class="card">
        <form id="login-form">
          <label class="field"><span>Email</span>
            <input type="email" name="email" required autocomplete="email" autofocus></label>
          <label class="field"><span>Password</span>
            <input type="password" name="password" required autocomplete="current-password"></label>
          <p class="error-msg" hidden></p>
          <button type="submit" style="width:100%">Sign in</button>
          <p style="text-align:center;margin:12px 0 0">
            <a href="/language#/forgot" style="font-size:0.9rem">Forgot your password?</a></p>
        </form>
      </div>
      <p class="login-note">Accounts are created by your project admin.</p>
    </div>
  </main>
  <script>
    // The server only serves this page to visitors without a valid session,
    // but a stale cached copy (back button) may load with one — bounce.
    // Old #/route bookmarks on the root are carried into the app after login.
    const appUrl = '/language' + (location.hash.startsWith('#/') ? location.hash : '');
    fetch('/api/platform/me').then((r) => { if (r.ok) location.replace(appUrl); }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const err = f.querySelector('.error-msg');
      err.hidden = true;
      try {
        const r = await fetch('/api/platform/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: f.email.value, password: f.password.value }),
        });
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error((data && data.error) || `Sign-in failed (${r.status})`);
        location.replace(appUrl);
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
