<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indigenous.ai</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🪶</text></svg>">
  <style>
    :root {
      --teal: #1f4e5f; --ochre: #8a4b2f; --paper: #fbf8f3; --ink: #2b2b2b;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .brand { font-size: 2.4rem; font-weight: 700; color: var(--teal); letter-spacing: 0.02em; }
    .tag { margin-top: 0.5rem; color: #666; font-size: 1.05rem; text-align: center; }
    .apps { margin-top: 2.5rem; width: 100%; max-width: 26rem; }
    .app-card {
      display: block; text-decoration: none; color: inherit;
      background: #fff; border: 1.5px solid var(--teal); border-radius: 10px;
      padding: 1.2rem 1.4rem; transition: box-shadow 0.15s;
    }
    .app-card:hover { box-shadow: 0 3px 12px rgba(31, 78, 95, 0.18); }
    .app-card h2 { color: var(--ochre); font-size: 1.25rem; }
    .app-card p { margin-top: 0.35rem; color: #555; font-size: 0.95rem; line-height: 1.45; }
    .app-card .go { margin-top: 0.6rem; color: var(--teal); font-weight: 600; font-size: 0.95rem; }
    footer { margin-top: 3rem; color: #999; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="brand">🪶 Indigenous.ai</div>
  <p class="tag">A platform for Indigenous governments.</p>
  <div class="apps">
    <a class="app-card" href="/language">
      <h2>Language</h2>
      <p>Community-owned language datasets: dictionary and phrases, voice recordings,
         translation work, and consent-governed exports.</p>
      <div class="go">Open Language →</div>
    </a>
  </div>
  <footer>Indigenous.ai</footer>
  <script>
    // Old bookmarks carried SPA hash routes on the root — forward them.
    if (location.hash.startsWith('#/')) location.replace('/language' + location.hash);
  </script>
</body>
</html>
